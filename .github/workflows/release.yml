name: Build signed Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yzj-release.jks"

      - name: Build signed release APK
        env:
          YZJ_RELEASE_STORE_FILE: ${{ runner.temp }}/yzj-release.jks
          YZJ_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          YZJ_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          YZJ_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: List artifacts
        run: ls -l app/build/outputs/apk/release/

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "yzj-client-${GITHUB_REF_NAME}-release.apk"
          sha256sum "yzj-client-${GITHUB_REF_NAME}-release.apk" > "yzj-client-${GITHUB_REF_NAME}-release.apk.sha256"

      - name: Create signed release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          generate_release_notes: true
          files: |
            yzj-client-*-release.apk
            yzj-client-*-release.apk.sha256
