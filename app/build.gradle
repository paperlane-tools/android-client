plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.yzj.client'
    compileSdk 34

    defaultConfig {
        applicationId "com.yzj.client"
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName "0.8.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

// Keep the Android assets in sync with the two canonical userscripts.
// Rebuilding the APK always picks up the latest quiz/materials scripts.
def syncUserscripts = tasks.register('syncUserscripts', Copy) {
    // 独立仓库里没有 ../quiz 与 ../materials；只有开发树里才同步。
    def quizSrc = rootProject.file('../quiz/csgmooc-helper.user.js')
    def matSrc = rootProject.file('../materials/userscript/csgmooc-materials.user.js')
    onlyIf { quizSrc.exists() && matSrc.exists() }
    if (quizSrc.exists()) {
        from(quizSrc) { rename { 'yzj-quiz.user.js' } }
    }
    if (matSrc.exists()) {
        from(matSrc) { rename { 'yzj-mat.user.js' } }
    }
    into(layout.projectDirectory.dir('src/main/assets'))
}

tasks.named('preBuild').configure {
    dependsOn(syncUserscripts)
}
