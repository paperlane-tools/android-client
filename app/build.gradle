plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def signingProps = new Properties()
def signingPropsFile = rootProject.file("keystore.properties")
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}

def releaseStorePath = System.getenv("YZJ_RELEASE_STORE_FILE") ?: signingProps.getProperty("storeFile")
def releaseStorePassword = System.getenv("YZJ_RELEASE_STORE_PASSWORD") ?: signingProps.getProperty("storePassword")
def releaseKeyAlias = System.getenv("YZJ_RELEASE_KEY_ALIAS") ?: signingProps.getProperty("keyAlias")
def releaseKeyPassword = System.getenv("YZJ_RELEASE_KEY_PASSWORD") ?: signingProps.getProperty("keyPassword")
def hasReleaseSigning = releaseStorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.yzj.client'
    compileSdk 34

    defaultConfig {
        applicationId "com.yzj.client"
        minSdk 26
        targetSdk 34
        versionCode 100
        versionName "1.0.0"
        manifestPlaceholders = [controlPermission: "com.yzj.client.release.permission.CONTROL"]
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            manifestPlaceholders = [controlPermission: "com.yzj.client.debug.permission.CONTROL"]
            resValue "string", "control_permission", "com.yzj.client.debug.permission.CONTROL"
        }
        release {
            minifyEnabled false
            manifestPlaceholders = [controlPermission: "com.yzj.client.release.permission.CONTROL"]
            resValue "string", "control_permission", "com.yzj.client.release.permission.CONTROL"
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

gradle.taskGraph.whenReady { graph ->
    if (!hasReleaseSigning &&
        graph.allTasks.any { it.name.toLowerCase().contains("release") }) {
        throw new GradleException(
            "Release signing is not configured. Provide keystore.properties or YZJ_RELEASE_* environment variables."
        )
    }
}

// Keep the Android assets in sync with the two canonical userscripts.
// Rebuilding the APK always picks up the latest quiz/materials scripts.
def syncUserscripts = tasks.register('syncUserscripts', Copy) {
    // 独立仓库里没有 ../quiz 与 ../materials；只有开发树里才同步。
    def quizSrc = rootProject.file('../quiz/csgmooc-helper.user.js')
    def matSrc = rootProject.file('../materials/userscript/csgmooc-materials.user.js')
    onlyIf { quizSrc.exists() && matSrc.exists() }
    if (quizSrc.exists()) {
        from(quizSrc) { rename { 'yzj-quiz.user.js' } }
    }
    if (matSrc.exists()) {
        from(matSrc) { rename { 'yzj-mat.user.js' } }
    }
    into(layout.projectDirectory.dir('src/main/assets'))
}

tasks.named('preBuild').configure {
    dependsOn(syncUserscripts)
}
